name: nexus-titan
# Values below are local Compose defaults only. Never use them in deployed environments.
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    profiles: [core, distributed, graph]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-nexus_dev}
    ports: ["127.0.0.1:5433:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
  migrate:
    build: { context: ., dockerfile: services/api/Dockerfile }
    profiles: [core, distributed, graph]
    command: ["python", "-m", "nexus_titan_api.migrations"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus_dev}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-nexus_dev}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  api:
    build: { context: ., dockerfile: services/api/Dockerfile }
    profiles: [core]
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus_dev}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-nexus_dev}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
      FIREBASE_AUTH_EMULATOR_HOST: ${FIREBASE_AUTH_EMULATOR_HOST:-}
      FIRESTORE_EMULATOR_HOST: ${FIRESTORE_EMULATOR_HOST:-}
      ALLOW_APPCHECK_BYPASS: ${ALLOW_APPCHECK_BYPASS:-false}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
  nats:
    image: nats:2.15.3-alpine3.22
    profiles: [distributed, graph]
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["127.0.0.1:4222:4222", "127.0.0.1:8222:8222"]
    volumes: [nats-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - 'http://127.0.0.1:8222/healthz?js-enabled-only=true' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 15
  event-worker:
    build: { context: ., dockerfile: services/api/Dockerfile }
    profiles: [distributed, graph]
    command: ["python", "-m", "nexus_titan_api.event_worker"]
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus_dev}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-nexus_dev}
      NATS_URL: nats://nats:4222
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIRESTORE_EMULATOR_HOST: ${FIRESTORE_EMULATOR_HOST:-}
      FIRESTORE_PROJECTIONS_ENABLED: ${FIRESTORE_PROJECTIONS_ENABLED:-false}
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      nats: { condition: service_healthy }
    restart: unless-stopped
  temporal:
    image: temporalio/temporal:1.10.1
    profiles: [distributed]
    user: root
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports: ["127.0.0.1:7233:7233", "127.0.0.1:8233:8233"]
    volumes: [temporal-data:/data]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 10s
      timeout: 5s
      retries: 15
  neo4j:
    image: neo4j:5.26.33-community
    profiles: [graph]
    environment:
      AUTH_PASSWORD: ${NEO4J_PASSWORD:-change-me-local-only}
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me-local-only}
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes: [neo4j-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${AUTH_PASSWORD}\" 'RETURN 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
  world-graph:
    build: { context: ., dockerfile: services/api/Dockerfile }
    profiles: [graph]
    command: ["python", "-m", "nexus_titan_api.world_graph", "--watch"]
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus_dev}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-nexus_dev}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me-local-only}
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      neo4j: { condition: service_healthy }
    restart: unless-stopped
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    profiles: [observe]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes: [./ops/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro]
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:4318:4318", "127.0.0.1:13133:13133"]
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  postgres-data:
  nats-data:
  temporal-data:
  neo4j-data:
