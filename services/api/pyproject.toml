[project]
name = "nexus-titan-api"
version = "0.1.0"
description = "NEXUS TITAN API foundation"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "firebase-admin>=6.6,<8",
    "jsonschema>=4.22,<5",
    "nats-py>=2.9,<3",
    "neo4j>=5.28,<7",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "B008",    # Do not perform function calls in argument defaults (standard FastAPI Depends idiom)
    "SIM117",  # Use a single `with` statement with multiple contexts (psycopg connection/transaction)
    "FURB162", # Unnecessary timezone replacement
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Security",
    "fastapi.Path",
    "fastapi.Body",
]

[tool.black]
line-length = 88
target-version = ["py312"]

